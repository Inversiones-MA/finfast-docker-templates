name: Notify Teams on PR Approval

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify-teams:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Send Teams notification
        # Todo dato del evento entra por `env:` y NUNCA se interpola dentro de
        # `run:`. GitHub sustituye `${{ }}` como texto crudo ANTES de que bash
        # parsee la linea, asi que un titulo de PR con la forma `'; cmd; '` se
        # EJECUTA — y ningun `sed` posterior lo evita, porque corre demasiado
        # tarde. Como variables de entorno son valores, no codigo (CWE-94).
        #
        # `title` y `head.ref` los controla quien abre el PR. Los demas los pone
        # GitHub, pero van por `env:` igual: la regla queda simple de auditar y
        # sin excepciones que discutir en cada revision.
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail

          # El payload lo arma `jq --arg`, que escapa el JSON por nosotros. El
          # heredoc anterior dependia de un `sed` que borraba comillas a mano:
          # un caracter no previsto rompia el JSON o, peor, el script.
          #
          # Nota: la version anterior tambien construia REVIEW_BODY desde
          # `github.event.review.body` y NUNCA lo usaba en el payload. Era el
          # vector mas expuesto (texto libre de un review) y era codigo muerto:
          # se elimina.
          jq -n \
            --arg repo     "$REPO" \
            --arg number   "$PR_NUMBER" \
            --arg title    "$PR_TITLE" \
            --arg url      "$PR_URL" \
            --arg author   "$PR_AUTHOR" \
            --arg head     "$PR_HEAD" \
            --arg base     "$PR_BASE" \
            --arg reviewer "$REVIEWER" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    {
                      type: "TextBlock",
                      size: "Medium",
                      weight: "Bolder",
                      text: ("✅ PR Aprobado en " + $repo)
                    },
                    {
                      type: "FactSet",
                      facts: [
                        { title: "PR:",           value: ("#" + $number + " — " + $title) },
                        { title: "Repositorio:",  value: $repo },
                        { title: "Autor:",        value: $author },
                        { title: "Aprobado por:", value: $reviewer },
                        { title: "Branch:",       value: ($head + " → " + $base) }
                      ]
                    }
                  ],
                  actions: [{
                    type: "Action.OpenUrl",
                    title: "Ver Pull Request",
                    url: $url
                  }]
                }
              }]
            }' > /tmp/teams.json

          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "Content-Type: application/json" \
            -d @/tmp/teams.json \
            "$TEAMS_WEBHOOK_URL"
